<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0a0a"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Green glow -->
  <ellipse cx="400" cy="225" rx="220" ry="120" fill="#22c55e" opacity="0.04"/>

  <!-- Reticle -->
  <circle cx="400" cy="225" r="90" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="225" r="50" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="225" r="8" fill="#22c55e" opacity="0.9"/>

  <!-- Crosshair -->
  <line x1="400" y1="120" x2="400" y2="168" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="282" x2="400" y2="330" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <line x1="295" y1="225" x2="343" y2="225" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <line x1="457" y1="225" x2="505" y2="225" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

  <!-- Candlestick chart (right side) -->
  <!-- Candle 1 - red -->
  <rect x="560" y="200" width="10" height="40" fill="#f87171" opacity="0.7"/>
  <line x1="565" y1="190" x2="565" y2="250" stroke="#f87171" stroke-width="1" opacity="0.7"/>
  <!-- Candle 2 - green -->
  <rect x="580" y="175" width="10" height="50" fill="#22c55e" opacity="0.7"/>
  <line x1="585" y1="165" x2="585" y2="235" stroke="#22c55e" stroke-width="1" opacity="0.7"/>
  <!-- Candle 3 - red -->
  <rect x="600" y="185" width="10" height="35" fill="#f87171" opacity="0.7"/>
  <line x1="605" y1="175" x2="605" y2="228" stroke="#f87171" stroke-width="1" opacity="0.7"/>
  <!-- Candle 4 - green signal candle -->
  <rect x="620" y="155" width="10" height="60" fill="#22c55e" opacity="0.9"/>
  <line x1="625" y1="140" x2="625" y2="225" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
  <!-- Signal dot on candle 4 -->
  <circle cx="625" cy="148" r="5" fill="#22c55e"/>

  <!-- EMA lines -->
  <polyline points="540,230 560,225 580,215 600,210 620,195 640,188" stroke="#4ade80" stroke-width="1.5" opacity="0.5" fill="none"/>
  <polyline points="540,245 560,240 580,232 600,228 620,218 640,210" stroke="#facc15" stroke-width="1" opacity="0.4" fill="none"/>

  <!-- Wordmark -->
  <text x="60" y="190" font-family="'Courier New', monospace" font-size="52" font-weight="700" letter-spacing="6" fill="white" opacity="0.95">KAIROS</text>
  <text x="62" y="218" font-family="'Courier New', monospace" font-size="11" font-weight="400" letter-spacing="5" fill="#71717a">SIGNAL SYSTEM</text>

  <!-- Tag line -->
  <text x="62" y="265" font-family="'Courier New', monospace" font-size="12" fill="#22c55e" opacity="0.8">Trade the moment.</text>

  <!-- Live badge -->
  <rect x="60" y="290" width="54" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <circle cx="74" cy="300" r="3" fill="#22c55e"/>
  <text x="82" y="304" font-family="'Courier New', monospace" font-size="9" fill="#22c55e" font-weight="700" letter-spacing="2">LIVE</text>

  <!-- Stats row -->
  <text x="60" y="370" font-family="'Courier New', monospace" font-size="11" fill="#3f3f46">Next.js · Coinbase WebSocket · Supabase · Stripe · Resend</text>
</svg>
